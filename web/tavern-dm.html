<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1916">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Tavern DM</title>
<style>
:root{--bg:#14110f;--panel:#1d1916;--panel2:#26211d;--line:#3a322b;--text:#ece3d6;--muted:#a3968a;--accent:#d9a441;--accent2:#e6b55a;
  --good:#7fb069;--bad:#d9625f;--xp:#8fa8e8;--you:#2f3a2a;--act:#b9ab9c;--speech:#f3ead9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--bad)}
button.icon{padding:6px 10px;font-size:18px;line-height:1}
input,select,textarea{background:#110e0c;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12.5px}
#app{display:flex;flex-direction:column;height:100dvh}
#view{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 24px}
.topbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.topbar h1{font-size:24px;margin:0 auto 0 0;color:var(--accent)}
.topbar.sub h1{font-size:19px}
h2.sec{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
#nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:none;border-radius:0;padding:9px 0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button b{font-size:20px;font-weight:400;line-height:1.1}
#nav button.on{color:var(--accent)}
body.chatmode #nav{display:none}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--panel2)}
.stack{display:inline-flex;flex:none}.stack .av{border:2px solid var(--bg)}.stack .av+.av{margin-left:-14px}
.search{margin-bottom:10px}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;background:none;border:none;border-radius:9px;padding:7px 10px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--panel2);color:var(--accent);font-weight:600}
.tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.tag{flex:none;font-size:12.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
.tag.on{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .pic{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;color:#fff;overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .body{padding:9px 10px 11px}
.card .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .line{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.card .mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mini span{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.card.add .pic{font-size:40px;color:var(--accent);background:transparent;border-bottom:1px dashed var(--line)}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.list .row:hover{background:var(--panel)}
.row .mid{flex:1;min-width:0}
.row .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:12px;color:var(--muted);flex:none;align-self:flex-start;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.profile{text-align:center}
.profile .big{width:180px;height:180px;border-radius:24px;object-fit:cover;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:700;color:#fff}
.profile h1{margin:0;font-size:24px}
.profile .tagline{color:var(--muted);margin:4px 0 10px}
.profile .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;text-align:left;white-space:pre-wrap}
.info h4{margin:0 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);padding-top:calc(8px + env(safe-area-inset-top))}
.chathead .ttl{flex:1;min-width:0;cursor:pointer}
.chathead .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .ttl small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpgbar{display:flex;gap:14px;padding:6px 14px;font-size:13px;border-bottom:1px solid var(--line);background:#181512;cursor:pointer;overflow-x:auto;white-space:nowrap}
.rpgbar .hp{color:var(--good)}.rpgbar .gold{color:var(--accent)}.rpgbar .xp{color:var(--xp)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;min-height:0}
.msgs-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:10px;align-items:flex-start}
.m.user{flex-direction:row-reverse}
.m .bub{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:9px 13px;max-width:min(640px,82%);position:relative;overflow-wrap:anywhere}
.m.user .bub{background:var(--you);border-color:#3e4b37;border-radius:16px 4px 16px 16px}
.m .who{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.m .txt p{margin:0 0 .55em}.m .txt p:last-child{margin:0}
.m .txt em.act{color:var(--act);font-style:italic}
.m .txt .sp{color:var(--speech)}
.m.note{justify-content:center}
.m.note .bub{background:transparent;border:1px dashed var(--accent);color:var(--accent);font-size:13px;border-radius:99px;padding:3px 12px;max-width:90%;text-align:center}
.swipes{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:12.5px;user-select:none}
.swipes button{padding:1px 10px;font-size:15px;border-radius:99px;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#110e0c}
.chip.xp{color:var(--xp)}.chip.gold{color:var(--accent)}.chip.hpup{color:var(--good)}.chip.hpdn{color:var(--bad)}.chip.item{color:#cbb8e8}
.editbox textarea{min-height:120px;margin-top:4px}
.editbox .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.speakers{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);overflow-x:auto;background:var(--panel)}
.speakers span{font-size:12px;color:var(--muted);flex:none}
.speakers button{padding:2px;border-radius:50%;border:2px solid transparent;background:none;flex:none}
.speakers button:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
.composer .inner{max-width:820px;margin:0 auto;display:flex;gap:8px;width:100%;align-items:flex-end}
.composer textarea{min-height:44px;max-height:170px;border-radius:22px;padding:11px 16px}
.composer .send{border-radius:50%;width:44px;height:44px;padding:0;font-size:18px;flex:none}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
/* sheets, menus, toast */
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90dvh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:18px}}
.sheet-card h3{margin:0 0 12px;color:var(--accent)}
.sheet-card h4{margin:16px 0 6px;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.btnrow.left{justify-content:flex-start}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.menu-list button{display:flex;width:100%;text-align:left;gap:10px;background:none;border:none;border-radius:10px;padding:11px 10px}
.menu-list button:hover{background:var(--panel2)}
.menu-list button.danger{color:var(--bad)}
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #000a;padding:4px;display:none;min-width:170px}
.pop.open{display:block}
.pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:8px}
.pop button:hover{background:var(--panel2)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 16px;border-radius:99px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.imgfield{display:flex;align-items:center;gap:12px}
.imgfield .av{width:84px;height:84px;border-radius:16px;font-size:34px}
.textlist .item{display:flex;gap:6px;margin-bottom:6px}
.status-ok{color:var(--good)}.status-bad{color:var(--bad)}
.sheetstat{display:flex;justify-content:space-between;align-items:center;background:#110e0c;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.sheetstat b{font-size:19px}
.bar{height:6px;background:#110e0c;border-radius:4px;overflow:hidden;margin:-4px 0 10px}.bar>div{height:100%;background:var(--xp)}.bar.hp>div{background:var(--good)}
.inv{list-style:none;padding:0;margin:0 0 8px}.inv li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.inv li button{padding:0 9px}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav">
    <button data-nav="discover"><b>✦</b>Discover</button>
    <button data-nav="chats"><b>💬</b>Chats</button>
    <button data-nav="me"><b>☺</b>Me</button>
  </nav>
</div>
<div class="sheet" id="sheet"><div class="sheet-card" id="sheetBody"></div></div>
<div class="pop" id="pop"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".png,.json,image/png,application/json" multiple style="display:none" title="Character cards or lorebooks">

<script>
// ============================================================ basics
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const API = location.origin + '/v1';
const OPT_DEFAULT = {pov:'second', length:'medium', difficulty:'normal', pacing:'balanced', intensity:'moderate', events:true, stats:true};
const STATS_DEFAULT = {level:1, xp:0, gold:25, hp:20, maxHp:20, inventory:[{name:'Rations',qty:3},{name:'Torch',qty:2}]};
let LIB = {genres:[], tones:[], characters:[], stories:[], personas:[], lore:[]};
let SET = {model:'', temperature:0.85, maxTokens:1200, history:30, personaId:'', autoSummary:true};
let CHAT = null, busy = false, abortCtl = null, discoverTag = '', discoverQ = '';

async function api(path, opts = {}) {
  const r = await fetch(path, {cache:'no-store', ...opts});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
async function loadLib() { try { LIB = {...LIB, ...(await api('/api/library'))}; } catch (e) { toast('Could not reach the Tavern DM app'); } }
async function loadSettings() { try { SET = {...SET, ...(await api('/api/settings'))}; } catch (e) {} }
function saveSettings() { post('/api/settings', SET).catch(() => {}); }
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function hue(s) { let h = 0; for (const c of String(s || '?')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avUrl(file) { return file === '__narrator' ? '/icon.png' : file ? '/avatars/' + encodeURIComponent(file) : ''; }
function avatar(file, name, size = 40, extra = '') {
  const u = avUrl(file);
  if (u) return `<img class="av" ${extra} style="width:${size}px;height:${size}px" src="${u}" alt="">`;
  return `<div class="av" ${extra} style="width:${size}px;height:${size}px;background:hsl(${hue(name)},40%,34%);font-size:${Math.round(size*.42)}px">${esc((name || '?').trim()[0]?.toUpperCase() || '?')}</div>`;
}
function timeAgo(ms) {
  if (!ms) return ''; const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd'; return new Date(ms).toLocaleDateString();
}
const charById = id => LIB.characters.find(c => c.id === id);
const activePersona = () => LIB.personas.find(p => p.id === SET.personaId) || LIB.personas[0] || {name:'You', avatar:'', description:''};
const sub = (t, char, user) => String(t || '').replace(/\{\{char\}\}|<BOT>/gi, char).replace(/\{\{user\}\}|<USER>/gi, user);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// ============================================================ text helpers
const TAG_RE = /\[(XP|EXP|GOLD|GP|MONEY|HP|ITEM)\s*:\s*([^\]]*)\]/gi;
const stripThink = t => String(t || '').replace(/<think>[\s\S]*?(<\/think>|$)/gi, '');
const cleanText = t => stripThink(t).replace(TAG_RE, '').replace(/\[[A-Za-z]{0,5}(:[^\]]*)?$/, '').replace(/\n{3,}/g, '\n\n').trim();
function fmt(t) {
  if (!t) return '';
  let h = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+?)\*/g, '<em class="act">$1</em>')
    .replace(/&quot;([^\n]+?)&quot;|“([^”\n]+?)”/g, (m, a, b) => `<span class="sp">“${a ?? b}”</span>`);
  return h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

// ============================================================ RPG
const xpFor = L => 50 * L * (L - 1);
const levelFromXp = xp => { let L = 1; while (xp >= xpFor(L + 1)) L++; return L; };
const maxHpFor = L => 20 + (L - 1) * 6;
const RPG_RULES = `TRACKING RULES:
When the player gains or loses something, add tags on their own lines at the very end of your reply:
[XP:+N] experience (10-30 small feats or clever ideas, 50-150 victories or finished quests)
[GOLD:+N] or [GOLD:-N] money gained or spent
[HP:-N] or [HP:+N] damage or healing
[ITEM:+Name] or [ITEM:-Name] items gained or used/lost (quantities like [ITEM:+3 Arrows])
Only use tags when the change actually happens. The player can't spend more gold than they have. At 0 HP they are downed.
When an action's outcome is uncertain, ask the player to roll (e.g. "Roll a d20") and wait. DC 10 easy, 15 medium, 20 hard.`;
function parseTags(t) {
  const out = []; let m; const src = stripThink(t); TAG_RE.lastIndex = 0;
  while ((m = TAG_RE.exec(src))) {
    let type = m[1].toUpperCase(), val = m[2].trim();
    if (type === 'EXP') type = 'XP'; if (type === 'GP' || type === 'MONEY') type = 'GOLD';
    if (type === 'ITEM') {
      const im = val.match(/^([+-])?\s*(\d+)?\s*x?\s+(.+)$/i) || val.match(/^([+-])?\s*()(.+)$/);
      if (!im) continue;
      const qty = parseInt(im[2] || '1') * (im[1] === '-' ? -1 : 1), name = im[3].trim();
      if (name) out.push({type, name, qty});
    } else { const n = parseInt(val.replace(/[^\d+-]/g, '')); if (!isNaN(n) && n !== 0) out.push({type, n}); }
  }
  return out;
}
function applyChanges(list) {
  const c = CHAT.stats, applied = [], notes = [];
  for (const ch of list) {
    if (ch.type === 'XP') {
      const before = c.level; c.xp = Math.max(0, c.xp + ch.n); applied.push({type:'XP', n:ch.n});
      c.level = levelFromXp(c.xp); const mx = maxHpFor(c.level);
      if (c.level > before) { c.maxHp = mx; c.hp = mx; notes.push(`⭐ Level up! Level ${c.level} (HP ${mx})`); }
      else if (c.level < before) { c.maxHp = mx; c.hp = Math.min(c.hp, mx); }
    } else if (ch.type === 'GOLD') { const d = Math.max(-c.gold, ch.n); c.gold += d; if (d) applied.push({type:'GOLD', n:d}); }
    else if (ch.type === 'HP') {
      const nhp = Math.max(0, Math.min(c.maxHp, c.hp + ch.n)), d = nhp - c.hp; c.hp = nhp; if (d) applied.push({type:'HP', n:d});
      if (c.hp === 0 && d < 0) notes.push('💀 You have been downed!');
    } else if (ch.type === 'ITEM') {
      const ex = c.inventory.find(i => i.name.toLowerCase() === ch.name.toLowerCase());
      if (ch.qty > 0) { if (ex) ex.qty += ch.qty; else c.inventory.push({name:ch.name, qty:ch.qty}); applied.push(ch); }
      else if (ex) { const d = Math.min(ex.qty, -ch.qty); ex.qty -= d; if (ex.qty <= 0) c.inventory = c.inventory.filter(i => i !== ex); applied.push({type:'ITEM', name:ex.name, qty:-d}); }
    }
  }
  return {applied, notes};
}
const revertChanges = list => applyChanges((list || []).slice().reverse().map(ch => ch.type === 'ITEM' ? {...ch, qty:-ch.qty} : {...ch, n:-ch.n}));
function chipHtml(ch) {
  if (ch.type === 'XP') return `<span class="chip xp">${ch.n > 0 ? '+' : ''}${ch.n} XP</span>`;
  if (ch.type === 'GOLD') return `<span class="chip gold">${ch.n > 0 ? '+' : ''}${ch.n} gold</span>`;
  if (ch.type === 'HP') return `<span class="chip ${ch.n > 0 ? 'hpup' : 'hpdn'}">${ch.n > 0 ? '+' : ''}${ch.n} HP</span>`;
  return `<span class="chip item">${ch.qty > 0 ? '+' : '−'}${Math.abs(ch.qty) > 1 ? Math.abs(ch.qty) + ' ' : ''}${esc(ch.name)}</span>`;
}
function statusLine() {

// ============================================================ chats: model & storage
function snap(c) { return {name:c.name, avatar:c.avatar || '', tagline:c.tagline || '', description:c.description || '', personality:c.personality || '',
  appearance:c.appearance || '', scenario:c.scenario || '', example_dialogue:c.example_dialogue || '', instructions:c.instructions || '', class:c.class || ''}; }
function normMsg(m) {
  m = {...m}; m.id = m.id || rid();
  if (m.role === 'assistant') {
    if (!Array.isArray(m.swipes) || !m.swipes.length) m.swipes = [m.content || ''];
    m.sw = Math.max(0, Math.min(m.sw || 0, m.swipes.length - 1));
    if (!Array.isArray(m.appliedS)) m.appliedS = m.swipes.map((_, i) => i === m.sw ? (m.applied || []) : []);
    m.content = m.swipes[m.sw]; m.charId = m.charId || 'narrator'; delete m.applied;
  }
  return m;
}
function normalizeChat(d, id) {
  d = d || {};
  const old = d.char || {};
  const c = {id:d.id || id, type:d.type || 'story', title:d.title || '', members:d.members || [], cast:d.cast || {},
    summary:d.summary || '', notes:d.notes || '', sumIdx:d.sumIdx || 0, updatedAt:d.updatedAt || 0};
  c.options = {...OPT_DEFAULT, ...(d.options || d.story?.options || {})};
  if (c.type === 'story') {
    c.story = d.story || {title:'My adventure', genres:[], tones:[], setting:d.settings?.world || '', premise:'', opening:'', role:'', characters:[], instructions:''};
    c.story.mode = c.story.mode || d.settings?.mode || 'dm';
  }
  c.persona = d.persona || {name:old.name || activePersona().name, avatar:'', description:old.background || d.settings?.backstory || '', cls:old.cls || ''};
  const st = d.stats || (d.char ? {level:old.level, xp:old.xp, gold:old.gold, hp:old.hp, maxHp:old.maxHp, inventory:old.inventory} : {});
  c.stats = {...STATS_DEFAULT}; for (const k in st) if (st[k] !== undefined) c.stats[k] = st[k];
  c.stats.inventory = structuredClone(c.stats.inventory || []);
  c.rpg = d.rpg ?? (c.type === 'story' ? c.options.stats !== false : false);
  c.messages = (d.messages || []).map(normMsg);
  return c;
}
function baseChat(type, chars) {
  const p = activePersona();
  return {id:newId(), type, title:'', members:chars.map(c => c.id), cast:Object.fromEntries(chars.map(c => [c.id, snap(c)])),
    persona:{name:p.name, avatar:p.avatar || '', description:p.description || ''}, rpg:chars.some(c => c.rpg),
    stats:structuredClone(STATS_DEFAULT), options:{...OPT_DEFAULT}, summary:'', notes:'', sumIdx:0, messages:[], updatedAt:0};
}
function charInfo(id) {
  if (id === 'narrator') return {name: CHAT?.story?.mode === 'story' ? 'Narrator' : 'Dungeon Master', avatar:'__narrator'};
  return charById(id) || CHAT?.cast?.[id] || {name:'Unknown', avatar:''};
}
function chatTitle(c = CHAT) {
  if (c.title) return c.title;
  if (c.type === 'story') return c.story?.title || 'Adventure';
  return c.members.map(id => charInfo(id).name).join(', ');
}
let saveTimers = {};
function saveChat(chat = CHAT, now = false) {
  if (!chat) return;
  chat.updatedAt = Date.now();
  clearTimeout(saveTimers[chat.id]);
  const go = () => post('/api/save/' + encodeURIComponent(chat.id), chat).catch(() => toast('⚠ Could not save — is the app running?'));
  if (now) return go();
  saveTimers[chat.id] = setTimeout(go, 400);
}

async function route() {

function autoSize() { const t = $('input'); if (!t) return; t.style.height = 'auto'; t.style.height = Math.min(170, t.scrollHeight) + 'px'; }

// ============================================================ prompts
const LEN = {short:'1-2 short paragraphs', medium:'2-3 paragraphs', long:'4-6 rich, detailed paragraphs'};
const DIFF = {easy:'Be forgiving: challenges are easy and failure is rarely deadly.', normal:'Balance challenge fairly.',
  hard:'Be tough: enemies are dangerous and mistakes are punished.', brutal:'Be merciless: the world is deadly and death is a real possibility.'};
const PACE = {slow:'Use a slow-burn pace: linger on atmosphere, dialogue and character moments.', balanced:'Balance action, dialogue and exploration.',
  fast:'Keep the pace fast and get to the action quickly.'};
const INT = {mild:'Keep violence and mature content mild and non-graphic.', moderate:'Mature themes are fine; keep graphic detail moderate.',
  intense:'Vivid, intense and mature depictions are allowed.', extreme:'Unflinching, graphic depictions are allowed where the story calls for it.'};
function memoryBlock(L) {
  if (CHAT.summary) L.push('', '[Story so far]', CHAT.summary);
  if (CHAT.notes) L.push('', '[Important notes to remember]', CHAT.notes);
}
function systemPrompt(sid) {
  const o = CHAT.options, user = CHAT.persona.name || 'User';
  if (CHAT.type === 'story') return storyPrompt();
  const c = charInfo(sid), S = t => sub(t, c.name, user);
  const L = [`You are ${c.name}. Write ${c.name}'s next reply in a fictional, never-ending roleplay chat with ${user}.`,
    `Stay in character. Write actions in *asterisks* and speech in "quotes". ${o.pov === 'third' ? `Narrate ${c.name} in the third person. ` : ''}Never write ${user}'s words, actions or thoughts. Write ${LEN[o.length]} per reply. Be creative and proactive, and move the scene forward.`,
    INT[o.intensity]];
  if (o.events) L.push('Occasionally introduce surprises or complications.');
  if (CHAT.type === 'group') {
    const others = CHAT.members.filter(m => m !== sid).map(charInfo);
    L.push('', `This is a group roleplay. Also present: ${others.map(x => `${x.name}${x.tagline ? ` (${x.tagline})` : ''}`).join('; ')}. Write only as ${c.name}; the others speak on their own turns.`);
  }
  L.push('', `[${c.name}]`);
  [['Description', c.description], ['Personality', c.personality], ['Appearance', c.appearance], ['Role', c.class]].forEach(([k, v]) => { if (v) L.push(`${k}: ${S(v)}`); });
  if (c.scenario) L.push('', '[Scenario]', S(c.scenario));
  if (CHAT.persona.description) L.push('', `[${user}]`, S(CHAT.persona.description));
  if (c.example_dialogue) L.push('', `[Example dialogue — shows ${c.name}'s voice, not real events]`, S(c.example_dialogue).replace(/<START>/gi, '').trim());
  if (c.instructions) L.push('', S(c.instructions));
  memoryBlock(L);
  if (CHAT.rpg) L.push('', RPG_RULES);
  L.push('', 'Any romantic or sexual content involves only adult characters (18+).');
  return L.join('\n');
}
function storyPrompt() {
  const st = CHAT.story, o = CHAT.options, p = CHAT.persona;
  const pov = o.pov === 'third' ? `Narrate in third person, referring to the player's character as ${p.name || 'the hero'}.` : 'Narrate in second person ("you").';
  const role = st.mode === 'dm'
    ? `You are the Dungeon Master running a tabletop-style RPG for one player. ${pov} Write ${LEN[o.length]} per reply. Describe scenes, play all NPCs and monsters, and keep the adventure moving with hooks, combat, puzzles, shops, quests and loot. Never decide the player's actions, words or feelings. When an action's outcome is uncertain, ask for a roll and wait. Natural 20 is a critical success, natural 1 a fumble. End each reply by asking what they do.`
    : `You are a collaborative storyteller in an immersive roleplay. ${pov} Write ${LEN[o.length]} per reply. Play every character except the player's, give each a distinct voice, follow the player's lead, add twists and emotional moments, and never speak or act for the player's character.`;
  const desc = x => x.prompt ? `${x.name} (${x.prompt})` : x.name;
  const L = [role, '', 'STORY:'];
  if (st.title) L.push(`Title: ${st.title}`);
  if (st.genres?.length) L.push('Genre: ' + st.genres.map(desc).join('; '));
  if (st.tones?.length) L.push('Story type: ' + st.tones.map(desc).join('; '));
  L.push('Setting: ' + (st.setting || 'Invent an original setting that fits the genre and story type.'));
  L.push('Premise: ' + (st.premise || 'Invent a compelling hook and plot.'));

    st.characters.forEach(k => L.push(`- ${k.name}${k.role ? ` [${k.role}]` : ''}${k.cls ? `, ${k.cls}` : ''}: ${[k.appearance, k.personality, k.description].filter(Boolean).join(' ')}`));

  L.push('', 'PLAYER CHARACTER:', `Name: ${p.name || 'Unnamed'}${p.cls ? ` | Class: ${p.cls}` : ''}`);
  if (p.description) L.push(`Background: ${p.description}`);

  if (CHAT.rpg) L.push('', RPG_RULES, 'The player\'s current stats are in [Status] at the end of their latest message.');

function worldInfo() {
  const text = CHAT.messages.slice(-4).map(m => m.content || '').join('\n').toLowerCase();
  const members = CHAT.members || [];
  return LIB.lore.filter(e => e.enabled !== false && e.content &&
      (!e.characters?.length || e.characters.some(id => members.includes(id))) &&
      (!e.keys?.length || e.keys.some(k => k && text.includes(String(k).toLowerCase()))))

}
function buildMessages(sid, target, mode) {
  const user = CHAT.persona.name || 'User', name = charInfo(sid).name;

  const out = conv.map(m => {
    if (m.role === 'user') return {role:'user', content:m.content};
    let t = stripThink(m.content).trim();

  });
  if (mode === 'continue') {

// ============================================================ generation
async function streamChat(messages, onToken) {
  abortCtl = new AbortController();
  const res = await fetch(API + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json'}, signal:abortCtl.signal,
    body:JSON.stringify({model:SET.model || undefined, messages, temperature:+SET.temperature, max_tokens:+SET.maxTokens, stream:true, chat_template_kwargs:{enable_thinking:false}})});
  if (!res.ok) throw new Error(res.status === 502 ? 'LM Studio is not reachable. Start its server and load a model.' : `HTTP ${res.status}: ${(await res.text()).slice(0, 160)}`);
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '', full = '';
  while (true) {
    const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true}); const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim(); if (!l.startsWith('data:')) continue;
      const d = l.slice(5).trim(); if (d === '[DONE]') continue;
      try { const dl = JSON.parse(d).choices?.[0]?.delta || {}; if (dl.content) { full += dl.content; onToken(full); } else if (dl.reasoning_content || dl.reasoning) onToken(full, true); } catch (e) {}
    }
  }
  return full;
}
async function generate(mode = 'new', speakerId = null) {
  if (busy || !CHAT) return;
  const chat = CHAT, msgs = chat.messages;
  let target, prevSw = 0;
  if (mode === 'new') {
    speakerId = speakerId || pickSpeaker();
    target = {id:rid(), role:'assistant', charId:speakerId, swipes:[''], sw:0, appliedS:[[]], content:''};
    msgs.push(target);
  } else {
    target = msgs.at(-1); if (!target || target.role !== 'assistant') return;
    speakerId = target.charId;
    if (mode === 'swipe') {
      prevSw = target.sw; if (chat.rpg) revertChanges(target.appliedS[target.sw]);
      target.swipes.push(''); target.appliedS.push([]); target.sw = target.swipes.length - 1; target.content = '';
    }
  }
  const prefix = mode === 'continue' ? target.content : '';
  const payload = buildMessages(speakerId, target, mode);
  setBusy(true); renderMsgs(true);
  const txtEl = () => document.querySelector(`.m[data-id="${target.id}"] .txt`);
  let latest = '';
  const nameRe = new RegExp('^\\s*' + escRe(charInfo(speakerId).name) + '\\s*:\\s*');
  const tidy = t => chat.type === 'group' ? t.replace(nameRe, '') : t;
  try {
    const text = await streamChat(payload, (full, thinking) => {
      latest = full; const el = txtEl(); if (!el) return;
      const shown = cleanText(prefix + tidy(full));
      el.innerHTML = shown ? fmt(shown) : (thinking ? '<span class="muted small">Thinking…</span> ' : '') + '<span class="typing"><i></i><i></i><i></i></span>';
      scrollDown();
    });
    const add = tidy(text);
    if (!cleanText(add)) throw new Error('The model returned no text. Try again, or turn off "thinking" for this model in LM Studio.');
    const final = mode === 'continue' ? prefix + (/\s$/.test(prefix) ? '' : ' ') + add.trim() : add;
    target.swipes[target.sw] = final; target.content = final;
    if (chat.rpg) {
      const {applied, notes} = applyChanges(parseTags(add));
      target.appliedS[target.sw] = mode === 'continue' ? [...(target.appliedS[target.sw] || []), ...applied] : applied;
      notes.forEach(n => msgs.push({id:rid(), role:'note', content:n}));
    }
  } catch (e) {
    if (e.name === 'AbortError' && cleanText(latest)) {
      const final = mode === 'continue' ? prefix + ' ' + tidy(latest).trim() : tidy(latest);
      target.swipes[target.sw] = final; target.content = final;
    } else {
      if (mode === 'new') msgs.splice(msgs.indexOf(target), 1);
      else if (mode === 'swipe') {
        target.swipes.pop(); target.appliedS.pop(); target.sw = prevSw; target.content = target.swipes[prevSw];
        if (chat.rpg) target.appliedS[prevSw] = applyChanges(target.appliedS[prevSw] || []).applied;
      }
      if (e.name !== 'AbortError') toast('⚠ ' + e.message, 4500);
    }
  }
  abortCtl = null; setBusy(false); saveChat(chat);
  if (chat === CHAT) { renderMsgs(); renderRpgBar(); }
  maybeSummarize(chat);
}
let summarizing = false;
async function maybeSummarize(chat = CHAT, force = false) {
  if (!chat || summarizing || (!SET.autoSummary && !force)) return;
  const conv = chat.messages.filter(m => (m.role === 'user' || m.role === 'assistant') && cleanText(m.content));
  const end = force ? conv.length : conv.length - SET.history;
  if (end - chat.sumIdx < (force ? 1 : 8)) { if (force) toast('Nothing new to summarize'); return; }
  const prevChat = CHAT; CHAT = chat;                     // charInfo() reads CHAT
  const text = conv.slice(chat.sumIdx, end).map(m => `${m.role === 'user' ? (chat.persona.name || 'User') : charInfo(m.charId).name}: ${cleanText(m.content)}`).join('\n\n');
  CHAT = prevChat;
  summarizing = true; if (force) toast('Updating memory…');
  try {
    const r = await fetch(API + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
      model:SET.model || undefined, temperature:0.3, max_tokens:700, stream:false, chat_template_kwargs:{enable_thinking:false},
      messages:[{role:'system', content:'You keep the long-term memory of an ongoing roleplay. Merge the new events into the existing summary. Keep names, relationships, feelings, promises, items, places and unresolved threads. Past tense, under 250 words. Output only the summary.'},
        {role:'user', content:`Existing summary:\n${chat.summary || '(none yet)'}\n\nNew events:\n${text}\n/no_think`}]})});
    const j = await r.json(); const s = cleanText(j.choices?.[0]?.message?.content || '');
    if (s) { chat.summary = s; chat.sumIdx = end; saveChat(chat); if (force || chat === CHAT) toast('🧠 Memory updated'); }
  } catch (e) { if (force) toast('Could not update memory'); }
  summarizing = false;
}

// ============================================================ message actions
function msgMenu(id, anchor) {
  if (busy) return;
  const msgs = CHAT.messages, m = msgs.find(x => x.id === id); if (!m) return;
  const isLast = m === msgs.at(-1), items = [['✏️ Edit', () => editMsg(m)], ['📋 Copy', () => { navigator.clipboard?.writeText(cleanText(m.content)); toast('Copied'); }]];
  if (m.role === 'assistant' && isLast) items.push(['🔄 New reply', () => generate('swipe')], ['➕ Continue', () => generate('continue')]);
  if (m.role === 'user' && isLast) items.push(['💬 Get reply', () => generate('new')]);
  items.push(['🗑 Delete', () => { if (CHAT.rpg && m.role === 'assistant') revertChanges(m.appliedS[m.sw]); msgs.splice(msgs.indexOf(m), 1); saveChat(); renderMsgs(); renderRpgBar(); }]);
  if (m.role !== 'note' && !isLast) items.push(['✂️ Delete everything after', () => {
    if (!confirm('Delete all messages after this one?')) return;
    const cut = msgs.splice(msgs.indexOf(m) + 1);

    saveChat(); renderMsgs(); renderRpgBar(); }]);
  showPop(anchor, items);
}
function editMsg(m) {
  const el = document.querySelector(`.m[data-id="${m.id}"] .txt`); if (!el) return;
  el.innerHTML = `<div class="editbox"><textarea>${esc(m.content)}</textarea><div class="btns"><button data-x="c">Cancel</button><button class="primary" data-x="s">Save</button></div></div>`;
  const ta = el.querySelector('textarea'); ta.focus();
  el.querySelector('[data-x=c]').onclick = e => { e.stopPropagation(); renderMsgs(); };
  el.querySelector('[data-x=s]').onclick = e => { e.stopPropagation(); m.content = ta.value; if (m.role === 'assistant') m.swipes[m.sw] = ta.value; saveChat(); renderMsgs(); };
}

    fields:[['name', 'Name', 'text'], ['book', 'Lorebook', 'text', 'Groups entries together, e.g. "Ashford" or "Star Wars"'], ['keys', 'Trigger words', 'tags', 'Leave empty to always include it'], ['content', 'What the AI should know', 'textarea'], ['characters', 'Only for these characters', 'checks', 'characters'], ['enabled', 'Enabled', 'toggle', 'Use this entry']]},
  genres:{title:'Genres', one:'genre', key:'name', fields:[['image', 'Image', 'image'], ['name', 'Name', 'text'], ['prompt', 'Description for the AI', 'textarea', 'What this world is like. This is sent to the AI.']]},
  tones:{title:'Story types', one:'story type', key:'name', fields:[['image', 'Image', 'image'], ['name', 'Name', 'text'], ['prompt', 'Description for the AI', 'textarea', 'How the AI should play this kind of story.']]},
};
async function viewLib(section) {
  const meta = LIB_META[section]; if (!meta) return go('#/me');
  await loadLib();
  const items = LIB[section];
  $('view').innerHTML = `<div class="wrap" style="max-width:720px">
    <div class="topbar sub"><button class="icon ghost" onclick="go('#/me')">‹</button><h1>${meta.title}</h1><button class="primary" onclick="go('#/edit/${section}/new')">+ New</button></div>
    ${meta.hint ? `<p class="muted small">${meta.hint}</p>` : ''}
    <div class="list">${items.length ? items.map(it => `<div class="row" data-id="${esc(it.id)}">${'avatar' in it || section === 'characters' || section === 'personas' ? avatar(it.avatar, it[meta.key], 40) : ''}
      <div class="mid"><div class="ttl">${esc(it[meta.key] || '(untitled)')}${it.enabled === false ? ' <span class="muted small">(off)</span>' : ''}</div><div class="sub">${esc(it.tagline || it.description || it.prompt || it.premise || it.content || (it.keys || []).join(', ') || '')}</div></div><span class="muted">›</span></div>`).join('')
      : `<div class="empty"><b>📭</b>Nothing here yet.</div>`}</div>
    ${section === 'characters' ? `<div class="btnrow left"><button onclick="$('importFile').click()">⇪ Import character cards</button></div>` : ''}</div>`;
  $('view').querySelectorAll('[data-id]').forEach(r => r.onclick = () => go(`#/edit/${section}/${r.dataset.id}`));
}
let EDIT = null;
async function viewEdit(section, id) {
  const meta = LIB_META[section]; if (!meta) return go('#/me');
  await loadLib();
  const isNew = id === 'new';
  const defaults = {characters:{tags:[], alt_greetings:[], role:'NPC', rpg:false}, lore:{enabled:true, keys:[], characters:[], book:discoverTab === 'lore' ? discoverTag : ''}, stories:{mode:'dm', tags:[], genres:[], tones:[], characters:[], rpg:true}}[section] || {};
  EDIT = isNew ? structuredClone(defaults) : structuredClone(LIB[section].find(x => x.id === id) || {});
  if (!isNew && !EDIT.id) return go('#/lib/' + section);
  $('view').innerHTML = `<div class="wrap" style="max-width:720px">
    <div class="topbar sub"><button class="icon ghost" onclick="history.back()">‹</button><h1>${isNew ? 'New' : 'Edit'} ${meta.one}</h1></div>
    <div id="form">${meta.fields.map(f => fieldHtml(f)).join('')}</div>
    <div class="btnrow">${isNew ? '' : '<button class="danger" id="delBtn">Delete</button>'}<button onclick="history.back()">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div>`;
  wireFields(meta.fields);
  $('saveBtn').onclick = async () => {
    readFields(meta.fields);
    if (!String(EDIT[meta.key] || '').trim()) return toast('Please give it a name');
    try { const saved = await post('/api/library/' + section, EDIT); await loadLib(); toast('Saved');
      if (isNew && section === 'characters') return go('#/char/' + saved.id);
      if (isNew && section === 'stories') return go('#/story/' + saved.id);
      history.back(); } catch (e) { toast('⚠ ' + e.message); }
  };
  if ($('delBtn')) $('delBtn').onclick = async () => { if (!confirm('Delete this?')) return; await api(`/api/library/${section}/${id}`, {method:'DELETE'}); await loadLib(); go({characters:'#/discover/characters', stories:'#/discover/stories', lore:'#/discover/lore', genres:'#/discover/genres', tones:'#/discover/genres'}[section] || '#/lib/' + section); };
}
function fieldHtml([k, label, type, extra]) {
  const v = EDIT[k], hint = typeof extra === 'string' && type !== 'checks' ? `<div class="hint">${esc(extra)}</div>` : '';
  switch (type) {
    case 'image': return `<div class="field"><label>${label}</label><div class="imgfield"><span id="f_${k}_pv">${avatar(v, EDIT.name || EDIT.title || '?', 84)}</span>
      <label class="tag" style="cursor:pointer">Choose image<input type="file" accept="image/*" id="f_${k}" style="display:none"></label><button class="ghost small" id="f_${k}_clr">Remove</button></div></div>`;
    case 'textarea': return `<div class="field"><label>${label}</label><textarea id="f_${k}" rows="${k === 'description' || k === 'content' ? 5 : 3}">${esc(v || '')}</textarea>${hint}</div>`;
    case 'tags': return `<div class="field"><label>${label}</label><input id="f_${k}" value="${esc((v || []).join(', '))}" placeholder="Comma separated">${hint}</div>`;
    case 'select': return `<div class="field"><label>${label}</label>${selHtml('f_' + k, extra, v || extra[0][0])}</div>`;
    case 'toggle': return `<label class="check"><input type="checkbox" id="f_${k}" ${v ? 'checked' : ''}> <span><b>${label}</b> <span class="muted small">${esc(extra || '')}</span></span></label>`;
    case 'checks': return `<div class="field"><label>${label}</label><div class="togs" id="f_${k}">${LIB[extra].map(it => `<span class="tag ${(v || []).includes(it.id) ? 'on' : ''}" data-id="${esc(it.id)}">${esc(it.name || it.title)}</span>`).join('') || '<span class="muted small">None yet</span>'}</div></div>`;
    case 'textlist': return `<div class="field"><label>${label}</label><div class="textlist" id="f_${k}">${(v || []).map(t => `<div class="item"><textarea rows="3">${esc(t)}</textarea><button class="ghost">✕</button></div>`).join('')}</div><button class="small" id="f_${k}_add">+ Add</button></div>`;
    default: return `<div class="field"><label>${label}</label><input id="f_${k}" value="${esc(v || '')}">${hint}</div>`;
  }
}
function wireFields(fields) {
  fields.forEach(([k, , type]) => {
    if (type === 'checks') $('f_' + k).querySelectorAll('.tag').forEach(t => t.onclick = () => t.classList.toggle('on'));
    if (type === 'textlist') {
      const box = $('f_' + k), wire = () => box.querySelectorAll('.item button').forEach(b => b.onclick = () => b.parentElement.remove());
      wire(); $(`f_${k}_add`).onclick = () => { box.insertAdjacentHTML('beforeend', '<div class="item"><textarea rows="3"></textarea><button class="ghost">✕</button></div>'); wire(); };
    }
    if (type === 'image') {
      $('f_' + k).onchange = async e => { const f = e.target.files[0]; if (!f) return;
        try { toast('Uploading…'); const data = await resizeImage(f, 640); const r = await post('/api/avatar', {data}); EDIT[k] = r.file; $(`f_${k}_pv`).innerHTML = avatar(r.file, '', 84); toast('Image added'); }
        catch (err) { toast('⚠ Could not upload image'); } };
      $(`f_${k}_clr`).onclick = () => { EDIT[k] = ''; $(`f_${k}_pv`).innerHTML = avatar('', EDIT.name || '?', 84); };
    }
  });
}
function readFields(fields) {
  fields.forEach(([k, , type]) => {
    const el = $('f_' + k);
    if (type === 'image') return;
    if (type === 'tags') EDIT[k] = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else if (type === 'toggle') EDIT[k] = el.checked;
    else if (type === 'checks') EDIT[k] = [...el.querySelectorAll('.tag.on')].map(t => t.dataset.id);
    else if (type === 'textlist') EDIT[k] = [...el.querySelectorAll('textarea')].map(t => t.value.trim()).filter(Boolean);
    else EDIT[k] = el.value.trim();
  });
}
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.88)); };
    img.onerror = rej; img.src = url;
  });
}

// ============================================================ import
$('importFile').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; let last = null, bad = 0;
  for (const f of files) {
    try { const buf = new Uint8Array(await f.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
      last = await post('/api/import', {name:f.name, data:btoa(bin)}); }
    catch (err) { bad++; toast('⚠ ' + f.name + ': ' + err.message, 4000); }
  }
  await loadLib();
  if (!last) return;
  if (last.kind === 'lore') { toast(`📖 Imported ${last.count} lore entr${last.count === 1 ? 'y' : 'ies'}${last.book ? ' into “' + last.book + '”' : ''}`); discoverTag = last.book || ''; return go('#/discover/lore'); }
  toast(`Imported ${files.length - bad} character${files.length - bad === 1 ? '' : 's'}`); go('#/char/' + last.id);
};

// ============================================================ start
(async () => {
  await Promise.all([loadLib(), loadSettings()]);
  if (!SET.personaId && LIB.personas[0]) SET.personaId = LIB.personas[0].id;
  route();
})();
</script>
